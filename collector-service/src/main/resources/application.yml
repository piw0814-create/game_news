server:
  port: 8084

spring:
  application:
    name: collector-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

collector:
  schedule:
    enabled: ${COLLECTOR_SCHEDULER_ENABLED:true}
    initial-delay: ${COLLECTOR_SCHEDULER_INITIAL_DELAY:10000}
    fixed-delay: ${COLLECTOR_SCHEDULER_FIXED_DELAY:600000}

  startup-catchup:
    enabled: ${COLLECTOR_STARTUP_CATCHUP_ENABLED:true}
    limit: ${COLLECTOR_STARTUP_CATCHUP_LIMIT:50}

  http:
    connect-timeout-ms: ${COLLECTOR_HTTP_CONNECT_TIMEOUT_MS:3000}
    rss-timeout-seconds: ${COLLECTOR_RSS_TIMEOUT_SECONDS:15}
    news-timeout-seconds: ${COLLECTOR_NEWS_TIMEOUT_SECONDS:5}

  sources:
    pcgamer:
      name: PC Gamer
      source-type: MEDIA
      rss-url: ${PCGAMER_RSS_URL:https://www.pcgamer.com/rss/}
      enabled: ${PCGAMER_SCHEDULER_ENABLED:true}
      limit: ${PCGAMER_SCHEDULER_LIMIT:10}

    destructoid:
      name: Destructoid
      source-type: MEDIA
      rss-url: ${DESTRUCTOID_RSS_URL:https://www.destructoid.com/feed/}
      enabled: ${DESTRUCTOID_SCHEDULER_ENABLED:true}
      limit: ${DESTRUCTOID_SCHEDULER_LIMIT:10}

    vgc:
      name: VGC
      source-type: MEDIA
      rss-url: ${VGC_RSS_URL:https://www.videogameschronicle.com/feed/}
      enabled: ${VGC_SCHEDULER_ENABLED:true}
      limit: ${VGC_SCHEDULER_LIMIT:10}

    kotaku:
      name: Kotaku
      source-type: MEDIA
      rss-url: ${KOTAKU_RSS_URL:https://kotaku.com/feed}
      enabled: ${KOTAKU_SCHEDULER_ENABLED:true}
      limit: ${KOTAKU_SCHEDULER_LIMIT:10}

    gematsu:
      name: Gematsu
      source-type: MEDIA
      rss-url: ${GEMATSU_RSS_URL:https://www.gematsu.com/feed}
      enabled: ${GEMATSU_SCHEDULER_ENABLED:true}
      limit: ${GEMATSU_SCHEDULER_LIMIT:10}

    gameinformer:
      name: Game Informer
      source-type: MEDIA
      rss-url: ${GAMEINFORMER_RSS_URL:https://gameinformer.com/news.xml}
      enabled: ${GAMEINFORMER_SCHEDULER_ENABLED:true}
      limit: ${GAMEINFORMER_SCHEDULER_LIMIT:10}

    gamedeveloper:
      name: Game Developer
      source-type: MEDIA
      rss-url: ${GAMEDEVELOPER_RSS_URL:https://www.gamedeveloper.com/rss.xml}
      enabled: ${GAMEDEVELOPER_SCHEDULER_ENABLED:true}
      limit: ${GAMEDEVELOPER_SCHEDULER_LIMIT:10}

    nintendolife:
      name: Nintendo Life
      source-type: MEDIA
      rss-url: ${NINTENDOLIFE_RSS_URL:https://www.nintendolife.com/feeds/latest}
      enabled: ${NINTENDOLIFE_SCHEDULER_ENABLED:true}
      limit: ${NINTENDOLIFE_SCHEDULER_LIMIT:10}

    pushsquare:
      name: Push Square
      source-type: MEDIA
      rss-url: ${PUSHSQUARE_RSS_URL:https://www.pushsquare.com/feeds/latest}
      enabled: ${PUSHSQUARE_SCHEDULER_ENABLED:true}
      limit: ${PUSHSQUARE_SCHEDULER_LIMIT:10}

    purexbox:
      name: Pure Xbox
      source-type: MEDIA
      rss-url: ${PUREXBOX_RSS_URL:https://www.purexbox.com/feeds/latest}
      enabled: ${PUREXBOX_SCHEDULER_ENABLED:true}
      limit: ${PUREXBOX_SCHEDULER_LIMIT:10}

    xboxwire:
      name: Xbox Wire
      source-type: OFFICIAL
      rss-url: ${XBOXWIRE_RSS_URL:https://news.xbox.com/en-us/feed/}
      enabled: ${XBOXWIRE_SCHEDULER_ENABLED:true}
      limit: ${XBOXWIRE_SCHEDULER_LIMIT:10}

    playstation:
      name: PlayStation Blog
      source-type: OFFICIAL
      rss-url: ${PLAYSTATION_RSS_URL:https://blog.playstation.com/feed/}
      enabled: ${PLAYSTATION_SCHEDULER_ENABLED:true}
      limit: ${PLAYSTATION_SCHEDULER_LIMIT:10}

  news-service:
    base-url: ${NEWS_SERVICE_URL:http://localhost:8082}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
