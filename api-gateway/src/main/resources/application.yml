server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          # 서비스 ID 기반 자동 라우팅을 막고 아래 명시 경로만 외부에 공개한다.
          enabled: false

      routes:
        # 자체 인증 - 로그인/JWKS는 User Service가 제공한다.
        - id: auth
          uri: lb://user-service
          predicates:
            - Path=/api/auth/login,/api/auth/jwks

        # User - 회원가입과 내 정보만 외부 공개
        - id: user-register
          uri: lb://user-service
          predicates:
            - Path=/api/users/register
            - Method=POST

        - id: user-me
          uri: lb://user-service
          predicates:
            - Path=/api/users/me
            - Method=GET

        # Admin operations - 파이프라인 상태는 각 소유 서비스로 직접 라우팅
        - id: admin-collector-operations
          order: -30
          uri: lb://collector-service
          predicates:
            - Path=/api/admin/operations/collector
            - Method=GET

        - id: admin-insight-operations
          order: -20
          uri: lb://insight-service
          predicates:
            - Path=/api/admin/operations/insight
            - Method=GET

        # Admin - 나머지 관리자 API는 News Service가 제공한다.
        - id: admin-api
          order: 0
          uri: lb://news-service
          predicates:
            - Path=/api/admin/**

        # Game - 사용자 조회 전용
        - id: game-read
          uri: lb://news-service
          predicates:
            - Path=/api/games,/api/games/**
            - Method=GET

        # Topic - 사용자 조회 전용
        - id: topic-read
          uri: lb://news-service
          predicates:
            - Path=/api/topics,/api/topics/**
            - Method=GET

        # Topic interaction - 로그인 사용자 댓글/좋아요 쓰기만 외부 공개
        - id: topic-comment-write
          uri: lb://news-service
          predicates:
            - Path=/api/topics/*/comments,/api/topics/*/comments/**
            - Method=POST,DELETE

        - id: topic-like-write
          uri: lb://news-service
          predicates:
            - Path=/api/topics/*/likes
            - Method=POST,DELETE

        # Interest - 로그인 사용자 관심 게임 관리
        - id: interest-service
          uri: lb://interest-service
          predicates:
            - Path=/api/interests/**

app:
  cors:
    allowed-origin-patterns: ${GAME_NEWS_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080}
  jwt:
    jwk-set-uri: ${GAME_NEWS_JWK_SET_URI:http://localhost:8081/api/auth/jwks}
    issuer: ${GAME_NEWS_JWT_ISSUER:game-news}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.gamenews.gateway.filter: DEBUG
