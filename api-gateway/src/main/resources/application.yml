server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          # 서비스 ID 기반 자동 라우팅을 막고 아래 명시 경로만 외부에 공개한다.
          enabled: false

      routes:
        # 자체 인증 - 로그인/JWKS는 User Service가 제공한다.
        - id: auth
          uri: lb://user-service
          predicates:
            - Path=/api/auth/login,/api/auth/jwks

        # User - 회원가입과 내 정보만 외부 공개
        - id: user-register
          uri: lb://user-service
          predicates:
            - Path=/api/users/register
            - Method=POST

        - id: user-me
          uri: lb://user-service
          predicates:
            - Path=/api/users/me
            - Method=GET

        # Game - 사용자 조회 전용
        - id: game-read
          uri: lb://news-service
          predicates:
            - Path=/api/games,/api/games/**
            - Method=GET

        # Topic - 사용자 조회 전용
        - id: topic-read
          uri: lb://news-service
          predicates:
            - Path=/api/topics,/api/topics/**
            - Method=GET

        # Interest - 로그인 사용자 관심 게임 관리
        - id: interest-service
          uri: lb://interest-service
          predicates:
            - Path=/api/interests/**

app:
  jwt:
    jwk-set-uri: ${GAME_NEWS_JWK_SET_URI:http://localhost:8081/api/auth/jwks}
    issuer: ${GAME_NEWS_JWT_ISSUER:game-news}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.gamenews.gateway.filter: DEBUG
