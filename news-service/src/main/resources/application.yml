server:
  port: 8082

spring:
  application:
    name: news-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3379/game_news_db}
    username: ${SPRING_DATASOURCE_USERNAME:manager}
    password: ${SPRING_DATASOURCE_PASSWORD:SqlDba-1}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect


  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# 서비스 간 통신 설정
service:
  user-service:
    url: http://user-service
  interest-service:
    url: ${INTEREST_SERVICE_URL:http://localhost:8083}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Kafka Topic
app:
  jwt:
    jwk-set-uri: ${GAME_NEWS_JWK_SET_URI:http://localhost:8081/api/auth/jwks}
    issuer: ${GAME_NEWS_JWT_ISSUER:game-news}
  kafka:
    topics:
      news-created: news.created
  igdb:
    client-id: ${IGDB_CLIENT_ID:}
    client-secret: ${IGDB_CLIENT_SECRET:}
    api-base-url: ${IGDB_API_BASE_URL:https://api.igdb.com/v4}
    token-url: ${IGDB_TOKEN_URL:https://id.twitch.tv/oauth2/token}
