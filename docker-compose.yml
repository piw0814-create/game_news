name: game_news
services:
  # Infrastructure

  mariadb:
    image: mariadb:11.2
    environment:
      MYSQL_ROOT_PASSWORD: SqlDba-1
      MYSQL_DATABASE: game_news_db
      MYSQL_USER: manager
      MYSQL_PASSWORD: SqlDba-1
    ports:
      - "3379:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - game-news-net

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - game-news-net

  # Service Discovery

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - game-news-net

  # API Gateway

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - GAME_NEWS_JWK_SET_URI=http://user-service:8081/api/auth/jwks
      - GAME_NEWS_JWT_ISSUER=${JWT_ISSUER:-game-news}
    depends_on:
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - game-news-net

  # Microservices

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/game_news_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JWT_PRIVATE_KEY_BASE64=${JWT_PRIVATE_KEY_BASE64}
      - JWT_PUBLIC_KEY_BASE64=${JWT_PUBLIC_KEY_BASE64}
      - JWT_KEY_ID=${JWT_KEY_ID:-game-news-key-1}
      - JWT_ISSUER=${JWT_ISSUER:-game-news}
      - JWT_ACCESS_TOKEN_TTL_SECONDS=${JWT_ACCESS_TOKEN_TTL_SECONDS:-3600}
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - game-news-net

  news-service:
    build:
      context: ./news-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/game_news_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - game-news-net

  interest-service:
    build:
      context: ./interest-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/game_news_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - NEWS_SERVICE_URL=http://news-service:8082
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      news-service:
        condition: service_started
    networks:
      - game-news-net

  collector-service:
    build:
      context: ./collector-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - NEWS_SERVICE_URL=http://news-service:8082
    depends_on:
      eureka-server:
        condition: service_healthy
      news-service:
        condition: service_started
    networks:
      - game-news-net

  insight-service:
    build:
      context: ./insight-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8085:8085"
    env_file:
      - ./insight-service/.env
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - EUREKA_INSTANCE_HOST=insight-service
      - JWT_ISSUER_URI=${JWT_ISSUER:-game-news}
      - JWK_SET_URI=http://user-service:8081/api/auth/jwks
      - NEWS_SERVICE_URL=http://news-service:8082
      - NEWS_SERVICE_TIMEOUT_SECONDS=10
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CONSUMER_GROUP_ID=insight-service
      - KAFKA_TOPIC_NEWS_CREATED=news.created
      - KAFKA_RETRY_DELAY_SECONDS=5
      - OPENAI_TOPIC_MATCH_MAX_OUTPUT_TOKENS=500
      - OPENAI_TOPIC_ANALYSIS_MAX_OUTPUT_TOKENS=900
      - TOPIC_ANALYSIS_ARTICLE_LIMIT=10
      - TOPIC_CANDIDATE_WINDOW_HOURS=48
      - TOPIC_CANDIDATE_DB_LIMIT=10
      - TOPIC_CANDIDATE_AI_LIMIT=3
      - TOPIC_MATCH_CONFIDENCE_THRESHOLD=0.85
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      news-service:
        condition: service_started
    networks:
      - game-news-net

# Volumes & Networks

volumes:
  mariadb_data:
  kafka_data:

networks:
  game-news-net:
    driver: bridge
